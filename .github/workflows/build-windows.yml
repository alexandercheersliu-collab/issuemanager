name: build-windows-package

# 手动触发：Actions → build-windows-package → Run workflow
# 产物：IssuesManager-<version>-windows-x64.zip（artifact，保留 14 天）
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      # Windows runner 默认 cp1252 控制台，脚本打印中文会 UnicodeEncodeError
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 预下载内置嵌入模型（约 79MB，打进包内离线可用）
        run: python scripts/install_onnx_model.py --dir deploy/bundle/models/onnx

      - name: 生成用户手册 PDF（微软雅黑）
        run: python scripts/build_user_manual_pdf.py --font C:\Windows\Fonts\msyh.ttc

      # mobile/dist 被 mobile/.gitignore 排除（标准 Vite 约定），CI 检出里没有，必须现场构建
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: 构建移动端（mobile/dist → 打包进 /m）
        working-directory: mobile
        run: |
          npm ci
          npm run build

      - name: PyInstaller 构建 onedir
        run: pyinstaller deploy/issues_manager.spec --noconfirm

      - name: 拷入手册并打 zip
        shell: pwsh
        run: |
          $version = (Select-String -Path backend/config.py -Pattern 'app_version[^=]*=\s*["'']([\d.]+)' | ForEach-Object { $_.Matches.Groups[1].Value })
          if (-not $version) { $version = "0.0.0" }
          Copy-Item docs/USER_MANUAL.md dist/IssuesManager/
          Copy-Item dist_assets/USER_MANUAL.pdf dist/IssuesManager/
          Compress-Archive -Path dist/IssuesManager -DestinationPath "IssuesManager-$version-windows-x64.zip"
          echo "PACKAGE=IssuesManager-$version-windows-x64.zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}
          retention-days: 14
