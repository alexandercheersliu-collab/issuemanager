[project]
name = "mathmaster-edu"
version = "2.0.0"
description = "基于视觉大模型与 RAG 的智能错题本系统"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "data", "migrations/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # 行长由 formatter 管理
    "B008", # Streamlit / FastAPI 风格的函数调用作默认参数
]

[tool.ruff.lint.isort]
known-first-party = ["backend", "frontend"]

[tool.ruff.lint.per-file-ignores]
# 入口文件首行必须 `import bootstrap`（注入 HOME/HF_HOME 等环境变量），
# 该 import 语义上要求置于所有第三方库之前，与 isort 排序规则冲突，故豁免。
"app.py" = ["I001"]
"api/main.py" = ["I001"]
"mcp_server.py" = ["I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "e2e: 端到端界面测试（需要运行中的应用与 Playwright 浏览器）",
]
filterwarnings = ["ignore::DeprecationWarning"]
